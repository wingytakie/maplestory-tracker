<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="title">HEXA Fragment Calculator</title>
<link rel="stylesheet" href="styles/main.css">
<link rel="stylesheet" href="styles/theme.css">
</head>
<body>
<main>
  <!-- Navigation bar -->
  <nav class="navbar">
    <div class="nav-brand" data-i18n="brand">HEXA Calculator</div>
    <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-menu" id="navMenu">
      <li><button class="theme-btn" id="themeToggle" data-i18n="themeToggle">🌓 Toggle Theme</button></li>
    </ul>
  </nav>

  <h1 data-i18n="title">HEXA Fragment Calculator</h1>
  <p class="sub" data-i18n="subtitle">Set each skill's current and goal level to see the Sol Erda Fragments and Sol Erda you still need.</p>

  <section class="card">
    <div class="row">
      <div><label for="job" data-i18n="jobLabel">Job class</label><select id="job"></select></div>
      <div><label for="fpd" data-i18n="fpdLabel">Fragments per day</label><input id="fpd" type="number" min="1" step="1"></div>
    </div>
    <div class="stats">
      <div class="stat"><small data-i18n="remFragments">Fragments still needed</small><b class="fr" id="remF">0</b></div>
      <div class="stat"><small data-i18n="remSolErda">Sol Erda still needed</small><b class="se" id="remS">0</b></div>
      <div class="stat"><small data-i18n="daysToGoal">Days to goal (fragments)</small><b id="days">0</b></div>
      <div class="stat"><small data-i18n="estCompletion">Estimated completion</small><b id="date">-</b></div>
    </div>
    <div class="pl"><span data-i18n="fragmentsInvested">Fragments invested</span><span id="pF"></span></div>
    <div class="bar" id="bF"><i></i></div>
    <div class="pl"><span data-i18n="solErdaInvested">Sol Erda invested</span><span id="pS"></span></div>
    <div class="bar" id="bS"><i></i></div>
  </section>

  <div id="sections"></div>

</main>

<!-- Bottom Corner Language Selector -->
<div class="lang-selector-wrapper">
  🌐 <select id="langSelect">
    <option value="en">English</option>
    <option value="ch_s">简体中文</option>
    <option value="ch_t">繁體中文</option>
  </select>
</div>

<script>
let TABLES = {}, JOBS = {}, i18n = {};
const SECTIONS = [["skill","skill"],["mastery","mastery"],["boost","boost"],["common","common"]];

const $ = s => document.querySelector(s);
const fmt = n => n.toLocaleString();
const slug = n => n.toLowerCase().replace(/[^a-z0-9]+/g,"-");
const cl = n => { n = Math.round(+n); return isNaN(n) ? 0 : Math.max(0, Math.min(30, n)) };
const t = key => i18n[key] || key;

const cost = (t, a, b) => {
  let s = 0, f = 0;
  for (let l = a; l < b; l++) {
    s += TABLES[t][l][0];
    f += TABLES[t][l][1];
  }
  return [s, f];
};

let S = { job: "Adele", fpd: 100, lv: {}, lang: "en" }, list = [];
try { Object.assign(S, JSON.parse(localStorage.getItem("hexaCalc") || "{}")) } catch(e) {}

const save = () => { try { localStorage.setItem("hexaCalc", JSON.stringify(S)) } catch(e) {} };
const lv = i => S.lv[S.job + "|" + list[i].name];

function applyTranslations() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (i18n[key]) el.textContent = i18n[key];
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el => {
    const key = el.getAttribute("data-i18n-html");
    if (i18n[key]) el.innerHTML = i18n[key];
  });
}

function loadLanguage(langCode) {
  fetch(`data/locales/${langCode}.json`)
    .then(r => r.json())
    .then(lang => {
      i18n = lang;
      S.lang = langCode;
      save();
      applyTranslations();
      build();
    });
}

function build() {
  list = []; let h = "";
  const jobData = JOBS[S.job];
  if (!jobData) return;

  // Extract faction and lower-case class name for directory building
  const faction = jobData.faction || "common";
  const className = S.job.toLowerCase().replace(/[^a-z0-9]+/g, "");

  for (const [sec, jsonKey] of SECTIONS) {
    if (!jobData[sec]) continue;
    const title = i18n.sections ? i18n.sections[jsonKey] : jsonKey;
    h += `<h3>${title}</h3><div class="grid">`;
    
    for (const e of jobData[sec]) {
      const localizedName = e.names[S.lang] || e.names["en"];
      const t = e.t || sec; 
      
      const i = list.length; 
      list.push({ name: localizedName, t, originalKey: e.names["en"] });
      
      const storageKey = S.job + "|" + e.names["en"];
      const v = S.lv[storageKey] || (S.lv[storageKey] = { c: 0, g: 30 });
      
      // Construct dynamic path: src/icon/[faction]/[class]/[filename]
      const imgFile = e.icon || `${slug(e.names["en"])}.webp`;
      const imgPath = `./src/icon/${faction}/${className}/${imgFile}`;
      
      h += `<div class="sk"><div class="ic"><img src="${imgPath}" alt="" onerror="this.remove()"></div>
      <div class="nm"><b>${localizedName}</b><span id="t${i}"></span></div>
      <div class="lv"><input type="number" min="0" max="30" data-i="${i}" data-w="c" value="${v.c}"><span>→</span><input type="number" min="0" max="30" data-i="${i}" data-w="g" value="${v.g}"></div>
      <div class="bar"><i id="b${i}"></i></div></div>`;
    }
    h += "</div>";
  }
  $("#sections").innerHTML = h; update();
}

function update() {
  let mS = 0, mF = 0, dS = 0, dF = 0, rS = 0, rF = 0;
  list.forEach((x, i) => {
    const v = lv(i), c = cl(v.c), g = Math.max(c, cl(v.g));
    const [ms, mf] = cost(x.t, 0, 30), [ds, df] = cost(x.t, 0, c), [rs, rf] = cost(x.t, c, g);
    mS += ms; mF += mf; dS += ds; dF += df; rS += rs; rF += rf;
    $("#t" + i).innerHTML = `<em>${fmt(rf)} ${t("fragmentsUnit")}</em> &middot; <u>${fmt(rs)} ${t("solErdaUnit")}</u>`;
    $("#b" + i).style.width = (mf ? df / mf * 100 : 0) + "%";
  });
  $("#remF").textContent = fmt(rF); $("#remS").textContent = fmt(rS);
  const fpd = Math.max(1, +S.fpd || 0), d = Math.ceil(rF / fpd);
  $("#days").textContent = fmt(d);
  const dt = new Date(); dt.setDate(dt.getDate() + d);
  $("#date").textContent = rF ? dt.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : t("done");
  const pf = mF ? dF / mF * 100 : 0, ps = mS ? dS / mS * 100 : 0;
  $("#bF i").style.width = pf + "\%"; $("#bS i").style.width = ps + "%";
  $("#pF").textContent = `${fmt(dF)} / ${fmt(mF)} (${pf.toFixed(1)}%)`;
  $("#pS").textContent = `${fmt(dS)} / ${fmt(mS)} (${ps.toFixed(1)}%)`;
  save();
}

// Hamburger & Theme Toggle
$("#hamburgerBtn").onclick = () => $("#navMenu").classList.toggle("open");
$("#themeToggle").onclick = () => {
  const current = document.documentElement.getAttribute("data-theme");
  const next = current === "light" ? "dark" : "light";
  if (next === "light") {
    document.documentElement.setAttribute("data-theme", "light");
    localStorage.setItem("theme", "light");
  } else {
    document.documentElement.removeAttribute("data-theme");
    localStorage.setItem("theme", "dark");
  }
};

if (localStorage.getItem("theme") === "light") {
  document.documentElement.setAttribute("data-theme", "light");
}

// Language Change Event
$("#langSelect").value = S.lang || "en";
$("#langSelect").onchange = e => loadLanguage(e.target.value);

// Initial Load
Promise.all([
  fetch("data/costTables.json").then(r => r.json()),
  fetch("data/classesData.json").then(r => r.json()),
  fetch(`data/locales/${S.lang || "en"}.json`).then(r => r.json())
]).then(([costs, classes, lang]) => {
  TABLES = costs;
  JOBS = classes;
  i18n = lang;
  
  applyTranslations();

  if (!JOBS[S.job]) S.job = Object.keys(JOBS)[0];
  
  $("#job").innerHTML = Object.keys(JOBS).map(j => `<option>${j}</option>`).join("");
  $("#job").value = S.job;
  $("#fpd").value = S.fpd;
  
  $("#job").onchange = e => { S.job = e.target.value; build(); };
  $("#fpd").oninput = e => { S.fpd = e.target.value; update(); };
  
  $("#sections").addEventListener("input", e => {
    const t = e.target; if (!t.dataset.i) return;
    lv(+t.dataset.i)[t.dataset.w] = t.value; update();
  });
  $("#sections").addEventListener("change", e => {
    const t = e.target; if (!t.dataset.i) return;
    const v = lv(+t.dataset.i); v.c = cl(v.c); v.g = Math.max(v.c, cl(v.g));
    const box = t.closest(".lv").querySelectorAll("input"); box[0].value = v.c; box[1].value = v.g; update();
  });
  
  build();
});
</script>
</body>
</html>
